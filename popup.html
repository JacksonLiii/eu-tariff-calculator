<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>EU关税落地成本计算器</title>
<style>
  body {
    width: 300px;
    margin: 0;
    padding: 12px;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  label {
    display: block;
    margin-top: 8px;
    margin-bottom: 3px;
    font-weight: 600;
  }
  .hint {
    font-weight: normal;
    color: #666;
    font-size: 11px;
  }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 6px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  #error {
    margin-top: 8px;
    color: #c0392b;
    font-size: 12px;
    display: none;
  }
  #result {
    margin-top: 12px;
    padding: 10px;
    background: #f5f7fa;
    border-radius: 4px;
    display: none;
  }
  #result div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  #result div:last-child {
    margin-bottom: 0;
    padding-top: 4px;
    border-top: 1px solid #ddd;
    font-weight: 600;
  }
  .footer-note {
    margin-top: 12px;
    font-size: 10px;
    color: #888;
    line-height: 1.5;
  }
  .disclaimer {
    margin-top: 6px;
    font-size: 10px;
    color: #888;
    font-style: italic;
  }
  #historySection {
    margin-top: 14px;
    border-top: 1px solid #e2e2e2;
    padding-top: 8px;
  }
  #historyToggle {
    width: 100%;
    background: none;
    color: #1a1a1a;
    border: none;
    padding: 4px 0;
    margin-top: 0;
    font-weight: 600;
    font-size: 13px;
    text-align: left;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
  }
  #historyToggle:hover {
    background: none;
    color: #2563eb;
  }
  #historyBody {
    display: none;
  }
  #historyList {
    max-height: 160px;
    overflow-y: auto;
    margin-top: 6px;
  }
  .historyEmpty {
    color: #888;
    font-size: 11px;
    padding: 4px 0;
  }
  .historyItem {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #eee;
    font-size: 11px;
  }
  .historyItem:last-child {
    border-bottom: none;
  }
  .historyTime {
    color: #888;
    flex-shrink: 0;
  }
  .historyMain {
    flex-grow: 1;
    text-align: right;
  }
  #clearHistoryBtn {
    width: 100%;
    margin-top: 8px;
    padding: 6px;
    font-size: 11px;
    font-weight: normal;
    color: #c0392b;
    background: #fdf2f1;
    border: 1px solid #f3c8c4;
  }
  #clearHistoryBtn:hover {
    background: #fbe4e2;
  }
  #usageStatus {
    margin-top: 6px;
    font-size: 11px;
    color: #666;
  }
  #usageStatus.pro {
    color: #b8860b;
    font-weight: 600;
  }
  #upgradePrompt {
    margin-top: 12px;
    padding: 10px;
    background: #fff7e6;
    border: 1px solid #f0d792;
    border-radius: 4px;
    display: none;
  }
  #upgradePrompt p {
    margin: 0 0 8px;
    font-size: 12px;
    color: #8a6400;
  }
  #upgradeBtn {
    margin-top: 0;
    background: #b8860b;
  }
  #upgradeBtn:hover {
    background: #96690a;
  }
</style>
</head>
<body>
  <h1>EU关税落地成本计算器</h1>
  <div id="usageStatus"></div>

  <label for="declaredValue">商品申报价值（欧元）</label>
  <input type="number" id="declaredValue" min="0" step="0.01" placeholder="例如 50" />

  <label for="categoryCount">包裹内不同品类数量 <span class="hint">（默认1，不同商品但同一分类算1个）</span></label>
  <input type="number" id="categoryCount" min="1" step="1" value="1" />

  <label for="countryCode">目的地国家</label>
  <select id="countryCode">
    <option value="DE">德国 DE（VAT 19%）</option>
    <option value="FR">法国 FR（VAT 20%）</option>
    <option value="IT">意大利 IT（VAT 22%）</option>
    <option value="ES">西班牙 ES（VAT 21%）</option>
    <option value="NL">荷兰 NL（VAT 21%）</option>
  </select>

  <button id="calcBtn">计算</button>

  <div id="error"></div>

  <div id="upgradePrompt">
    <p>今日免费次数已用完，升级Pro解锁无限次数</p>
    <button id="upgradeBtn" type="button">升级Pro</button>
  </div>

  <div id="result">
    <div><span>关税</span><span id="rDuty"></span></div>
    <div><span>VAT</span><span id="rVat"></span></div>
    <div><span>附加成本占比</span><span id="rPct"></span></div>
    <div><span>落地总成本</span><span id="rTotal"></span></div>
  </div>

  <div class="footer-note">
    清关处理费(~€2/包裹)预计2026年11月上线，暂未计入。数据来源：Council Regulation (EU) 2026/382；最后核实日期：2026-08-04。
  </div>
  <div class="disclaimer">仅供参考，非正式关务/税务意见。</div>

  <div id="historySection">
    <button id="historyToggle" type="button">
      <span>历史记录</span>
      <span id="historyToggleIcon">▸</span>
    </button>
    <div id="historyBody">
      <div id="historyList"></div>
      <button id="clearHistoryBtn" type="button">清空历史</button>
    </div>
  </div>

  <script src="calculator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
