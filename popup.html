<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>EU Landed Cost Calculator</title>
<style>
  body {
    width: 300px;
    margin: 0;
    padding: 12px;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 13px;
    color: #1a1a1a;
  }
  h1 {
    font-size: 15px;
    margin: 0 0 10px;
  }
  label {
    display: block;
    margin-top: 8px;
    margin-bottom: 3px;
    font-weight: 600;
  }
  .hint {
    font-weight: normal;
    color: #666;
    font-size: 11px;
  }
  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 6px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
  button:hover {
    background: #1d4ed8;
  }
  #error {
    margin-top: 8px;
    color: #c0392b;
    font-size: 12px;
    display: none;
  }
  #result {
    margin-top: 12px;
    padding: 10px;
    background: #f5f7fa;
    border-radius: 4px;
    display: none;
  }
  #result div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  #result div:last-child {
    margin-bottom: 0;
    padding-top: 4px;
    border-top: 1px solid #ddd;
    font-weight: 600;
  }
  .footer-note {
    margin-top: 12px;
    font-size: 10px;
    color: #888;
    line-height: 1.5;
  }
  .disclaimer {
    margin-top: 6px;
    font-size: 10px;
    color: #888;
    font-style: italic;
  }
  #historySection {
    margin-top: 14px;
    border-top: 1px solid #e2e2e2;
    padding-top: 8px;
  }
  #historyToggle {
    width: 100%;
    background: none;
    color: #1a1a1a;
    border: none;
    padding: 4px 0;
    margin-top: 0;
    font-weight: 600;
    font-size: 13px;
    text-align: left;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
  }
  #historyToggle:hover {
    background: none;
    color: #2563eb;
  }
  #historyBody {
    display: none;
  }
  #historyList {
    max-height: 160px;
    overflow-y: auto;
    margin-top: 6px;
  }
  .historyEmpty {
    color: #888;
    font-size: 11px;
    padding: 4px 0;
  }
  .historyItem {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 4px 0;
    border-bottom: 1px solid #eee;
    font-size: 11px;
  }
  .historyItem:last-child {
    border-bottom: none;
  }
  .historyTime {
    color: #888;
    flex-shrink: 0;
  }
  .historyMain {
    flex-grow: 1;
    text-align: right;
  }
  #clearHistoryBtn {
    width: 100%;
    margin-top: 8px;
    padding: 6px;
    font-size: 11px;
    font-weight: normal;
    color: #c0392b;
    background: #fdf2f1;
    border: 1px solid #f3c8c4;
  }
  #clearHistoryBtn:hover {
    background: #fbe4e2;
  }
  #usageStatus {
    margin-top: 6px;
    font-size: 11px;
    color: #666;
  }
  #usageStatus.pro {
    color: #b8860b;
    font-weight: 600;
  }
  #upgradePrompt {
    margin-top: 12px;
    padding: 10px;
    background: #fff7e6;
    border: 1px solid #f0d792;
    border-radius: 4px;
    display: none;
  }
  #upgradePrompt p {
    margin: 0 0 8px;
    font-size: 12px;
    color: #8a6400;
  }
  #upgradeBtn {
    /* Inherits the standard blue from `button` — no colour override, so the
       primary action looks the same here as everywhere else in the popup. */
    margin-top: 0;
  }
  #licenseSection {
    margin-top: 10px;
  }
  #licenseToggle {
    background: none;
    color: #888;
    border: none;
    padding: 0;
    margin-top: 0;
    font-size: 11px;
    font-weight: normal;
    text-decoration: underline;
    cursor: pointer;
    width: auto;
  }
  #licenseToggle:hover {
    background: none;
    color: #2563eb;
  }
  #licenseBody {
    display: none;
    margin-top: 6px;
  }
  #licenseKeyInput {
    font-size: 12px;
  }
  #activateBtn {
    margin-top: 6px;
    padding: 6px;
    font-size: 12px;
  }
  #activateBtn:disabled {
    opacity: 0.6;
    cursor: default;
  }
  #licenseMessage {
    margin-top: 6px;
    font-size: 11px;
    display: none;
  }
  #licenseMessage.success {
    color: #1a7f37;
  }
  #licenseMessage.error {
    color: #c0392b;
  }
</style>
</head>
<body>
  <h1 data-i18n="appName"></h1>
  <div id="usageStatus"></div>

  <label for="declaredValue" data-i18n="declaredValueLabel"></label>
  <input type="number" id="declaredValue" min="0" step="0.01" data-i18n-placeholder="declaredValuePlaceholder" />

  <label for="categoryCount"><span data-i18n="categoryCountLabel"></span> <span class="hint" data-i18n="categoryCountHint"></span></label>
  <input type="number" id="categoryCount" min="1" step="1" value="1" />

  <label for="countryCode" data-i18n="countryCodeLabel"></label>
  <!-- options are built in popup.js from VAT_RATES + the localized country names -->
  <select id="countryCode"></select>

  <button id="calcBtn" data-i18n="calcButton"></button>

  <div id="error"></div>

  <div id="upgradePrompt">
    <p data-i18n="upgradePromptText"></p>
    <button id="upgradeBtn" type="button" data-i18n="upgradeButton"></button>
  </div>

  <div id="result">
    <div><span data-i18n="dutyLabel"></span><span id="rDuty"></span></div>
    <div><span data-i18n="vatLabel"></span><span id="rVat"></span></div>
    <div><span data-i18n="pctLabel"></span><span id="rPct"></span></div>
    <div><span data-i18n="totalLabel"></span><span id="rTotal"></span></div>
  </div>

  <div class="footer-note" data-i18n="footerNote"></div>
  <div class="disclaimer" data-i18n="disclaimer"></div>

  <div id="licenseSection">
    <button id="licenseToggle" type="button" data-i18n="licenseToggleText"></button>
    <div id="licenseBody">
      <input type="text" id="licenseKeyInput" data-i18n-placeholder="licenseKeyPlaceholder" />
      <button id="activateBtn" type="button" data-i18n="activateButton"></button>
      <div id="licenseMessage"></div>
    </div>
  </div>

  <div id="historySection">
    <button id="historyToggle" type="button">
      <span data-i18n="historyToggleText"></span>
      <span id="historyToggleIcon">▸</span>
    </button>
    <div id="historyBody">
      <div id="historyList"></div>
      <button id="clearHistoryBtn" type="button" data-i18n="clearHistoryButton"></button>
    </div>
  </div>

  <script src="calculator.js"></script>
  <script src="popup.js"></script>
</body>
</html>
